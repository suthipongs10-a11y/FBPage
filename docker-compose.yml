# Facebook AI Page Manager — production-ish stack สำหรับ Ubuntu VPS (AGENTS.md §81)
# ใช้:  docker compose --env-file .env up -d --build
# บริการ: web · api · worker · postgres · redis · caddy (reverse proxy + HTTPS)

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong database password}
      POSTGRES_DB: fbpm
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fbpm"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Set database password}@postgres:5432/fbpm?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?Preserve the existing encryption secret during migration}
      REDIS_URL: redis://redis:6379
      API_PORT: 4000
      APP_ENV: production
      MESSENGER_AUTO_SEND_ENABLED: 'false'
      MEDIA_DIR: /app/data/media
    volumes:
      - media-data:/app/data/media
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    profiles: [automation]
    build:
      context: .
      dockerfile: workers/scheduler/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Set database password}@postgres:5432/fbpm?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?Preserve the existing encryption secret during migration}
      REDIS_URL: redis://redis:6379
      MEDIA_DIR: /app/data/media
      APP_ENV: production
      MESSENGER_AUTO_SEND_ENABLED: 'false'
    volumes:
      - media-data:/app/data/media   # publisher อ่านไฟล์ภาพที่ API สร้างไว้ (path เดียวกันทั้งสองคอนเทนเนอร์)
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${APP_PUBLIC_API_URL:-/api}
    restart: unless-stopped
    environment:
      API_URL: http://api:4000
      PORT: 3000
    depends_on:
      api: { condition: service_healthy }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Set the approved domain after VPS preflight}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - web
      - api

  migrate:
    profiles: [maintenance]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrate
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Set database password}@postgres:5432/fbpm?schema=public
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  media-data:
  pgdata:
  redisdata:
  caddydata:
  caddyconfig:
