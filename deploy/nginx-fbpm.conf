# nginx ของเครื่อง → SocialManage (คู่กับ deploy/docker-compose.host-nginx.yml)
# ติดตั้ง: แทน fbm.example.com ด้วยโดเมนจริง → วางที่ /etc/nginx/sites-available/fbpm → ลิงก์เข้า sites-enabled
#          → nginx -t && systemctl reload nginx → certbot --nginx -d <โดเมน> (certbot เติมส่วน 443 + redirect ให้เอง)
server {
    listen 80;
    listen [::]:80;
    server_name fbm.example.com;

    client_max_body_size 10m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # API อยู่หลัง /api/ — "/" ท้าย proxy_pass ตัด prefix ออกเหมือน handle_path ของ Caddy
    location /api/ {
        proxy_pass http://127.0.0.1:4100/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # เขียนทับ ไม่ต่อท้าย: API ใช้ค่าแรกของ X-Forwarded-For ทำ rate limit — ถ้าต่อท้าย client ปลอม IP ได้
        # ถ้าเปิด proxy ของ Cloudflare (เมฆส้ม) ภายหลัง ต้องตั้ง real_ip_header CF-Connecting-IP ก่อน ไม่งั้นทุกคนได้ IP ของ Cloudflare
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # งาน AI บางงานตอบช้ากว่า 60 วิ (ค่าเริ่มต้นของ nginx)
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
